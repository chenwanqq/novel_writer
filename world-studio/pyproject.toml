[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world-studio"
version = "0.1.0"
description = "Local, versioned worldbuilding and writing harness"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "mcp>=1.20,<2", "starlette>=0.40,<1", "uvicorn>=0.32,<1", "pillow>=11,<13"]

[project.scripts]
world-studio = "world_studio.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
